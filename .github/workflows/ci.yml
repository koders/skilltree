name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate content (hard rules fail, warnings report)
        run: pnpm validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Pages render per request; the build never talks to Supabase.
          SUPABASE_PROJECT_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-placeholder
